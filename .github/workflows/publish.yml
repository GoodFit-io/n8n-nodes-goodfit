# Stages each tagged version on npm with provenance via Trusted Publishing (stage only).
# It goes public once a maintainer approves it with 2FA: `npm stage approve` or npmjs.com.
name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./package.json").version')"

      - name: Install an npm with staged publishing
        run: npm install -g npm@11.21.1

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run typecheck && npm test

      - name: Lint and build
        run: npm run lint && npm run build

      - name: Stage the release
        run: npm stage publish --provenance
        env:
          RELEASE_MODE: 'true'
