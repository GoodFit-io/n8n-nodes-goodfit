# n8n requires community nodes to be published from GitHub Actions with npm provenance.
# Auth: npm Trusted Publishing for this repo and publish.yml, or an NPM_TOKEN secret as a fallback.
name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./package.json").version')"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run typecheck && npm test

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
