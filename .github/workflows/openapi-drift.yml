name: OpenAPI drift

# Fails when a published GoodFit OpenAPI document no longer matches the copy in openapi/.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Compare committed specs with api.goodfit.io
        run: node scripts/sync-openapi.mjs --check
